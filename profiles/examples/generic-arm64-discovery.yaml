# Generic ARM64 discovery example (illustrative YAML; not executable in v0.2).
# This does not identify a particular board or assume specific peripherals.
apiVersion: ubuntu-customizer/v1
kind: SystemProfile
metadata:
  name: generic-arm64-discovery
target:
  distribution: ubuntu
  architecture: arm64
diagnostics:
  read_only: true
  detect_capabilities: true
  collect:
    - system-identity
    - cpu-and-memory
    - storage-and-boot
    - buses-and-devices
    - kernel-drivers
    - networking
    - device-tree-if-available
    - gpio-and-pinmux-if-available
execution:
  dry_run: true
  reboot: manual
